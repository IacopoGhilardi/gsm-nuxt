# Su Netlify, Nitro rileva l'ambiente e passa da solo al preset
# "netlify-static", che scrive in dist/ (non in .output/public, che e' il
# percorso del preset predefinito usato in locale). Il preset genera anche
# _headers e _redirects, quindi qui non serve altro.
#
# Il rendering dei cataloghi NON fa parte del build: le pagine WebP vivono
# su R2 e ci arrivano da scripts/render-catalogs.mjs lanciato in locale.

[build]
  command = "npm run generate"
  publish = "dist"

[build.environment]
  # Nuxt 4 richiede ^22.22.3 || ^24.15.0 || >=26.0.0
  NODE_VERSION = "22.22.3"
